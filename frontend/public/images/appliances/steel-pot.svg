      <stop offset="0%" stop-color="#111827" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sp-steel" x1="25" y1="45" x2="95" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9ca3af"/>
