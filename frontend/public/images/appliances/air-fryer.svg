<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <radialGradient id="af-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="af-body" x1="20" y1="20" x2="96" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3f4652"/>
      <stop offset="35%" stop-color="#222730"/>
      <stop offset="75%" stop-color="#151921"/>
      <stop offset="100%" stop-color="#2c323d"/>
    </linearGradient>
    <linearGradient id="af-top" x1="28" y1="14" x2="92" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4e5664"/>
      <stop offset="50%" stop-color="#262b35"/>
      <stop offset="100%" stop-color="#191d24"/>
    </linearGradient>
    <linearGradient id="af-steel" x1="26" y1="62" x2="94" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9ca3af"/>
      <stop offset="25%" stop-color="#f3f4f6"/>
      <stop offset="55%" stop-color="#9ca3af"/>
      <stop offset="85%" stop-color="#d1d5db"/>
      <stop offset="100%" stop-color="#6b7280"/>
    </linearGradient>
    <linearGradient id="af-copper" x1="34" y1="44" x2="86" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#b4693e"/>
      <stop offset="50%" stop-color="#f5b882"/>
      <stop offset="100%" stop-color="#9a522b"/>
    </linearGradient>
    <linearGradient id="af-handle" x1="52" y1="68" x2="68" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4b5563"/>
      <stop offset="45%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <ellipse cx="60" cy="107" rx="34" ry="7" fill="url(#af-shadow)"/>
  <!-- Main rounded body -->
  <path d="M27 32C27 22 41 16 60 16C79 16 93 22 93 32L90 92C90 100 77 105 60 105C43 105 30 100 30 92L27 32Z" fill="url(#af-body)"/>
  <!-- Subtle left specular highlight -->
  <path d="M33 36C33 36 35 88 37 94" stroke="#ffffff" stroke-opacity="0.16" stroke-width="3" stroke-linecap="round"/>
  <!-- Top angled bevel cap -->
  <ellipse cx="60" cy="27" rx="31" ry="11" fill="url(#af-top)" stroke="#525b6a" stroke-width="0.8"/>
  <!-- Digital touch control panel -->
  <path d="M40 28C40 24.5 49 22 60 22C71 22 80 24.5 80 28C80 31.5 71 34 60 34C49 34 40 31.5 40 28Z" fill="#0b0e14" stroke="#374151" stroke-width="0.7"/>
  <!-- Glowing digital icons & temp display -->
  <text x="60" y="29.5" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="6.5" font-weight="bold">200°C</text>
  <circle cx="47" cy="28" r="1.3" fill="#f97316"/>
  <circle cx="73" cy="28" r="1.3" fill="#22c55e"/>
  <!-- Brushed steel collar trim -->
  <path d="M28.2 54C36 58.5 84 58.5 91.8 54L91.6 58C84 62.5 36 62.5 28.4 58Z" fill="url(#af-steel)"/>
  <!-- Copper accent line -->
  <path d="M29 59.5C37 63.8 83 63.8 91 59.5" stroke="url(#af-copper)" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Removable basket seam -->
  <path d="M36 62V95C36 99 46 102 60 102C74 102 84 99 84 95V62" stroke="#0b0e14" stroke-width="1.6"/>
  <path d="M37 63V94" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1"/>
  <!-- Viewing window hint -->
  <rect x="44" y="66" width="32" height="10" rx="4" fill="#111827" stroke="#374151" stroke-width="0.8"/>
  <rect x="46" y="68" width="28" height="6" rx="2.5" fill="#7c2d12" fill-opacity="0.45"/>
  <!-- Ergonomic drawer handle -->
  <rect x="52" y="70" width="16" height="5" rx="2" fill="url(#af-steel)"/>
  <path d="M54 73C54 73 53 92 55 96C56.5 99 63.5 99 65 96C67 92 66 73 66 73Z" fill="url(#af-handle)" stroke="#4b5563" stroke-width="0.8"/>
  <path d="M57 76V93" stroke="#9ca3af" stroke-opacity="0.35" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Feet -->
  <rect x="34" y="101" width="7" height="4" rx="2" fill="#0f172a"/>
  <rect x="79" y="101" width="7" height="4" rx="2" fill="#0f172a"/>
</svg>
