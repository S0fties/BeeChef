<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <radialGradient id="cb-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cb-oak" x1="18" y1="22" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#eab676"/>
      <stop offset="50%" stop-color="#d49352"/>
      <stop offset="100%" stop-color="#b46b2c"/>
    </linearGradient>
    <linearGradient id="cb-edge" x1="20" y1="88" x2="100" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>
  <ellipse cx="60" cy="100" rx="44" ry="7" fill="url(#cb-shadow)"/>
  <!-- Thickness 3D bottom lip -->
  <rect x="20" y="25" width="80" height="72" rx="10" fill="url(#cb-edge)"/>
  <!-- Main wooden board surface -->
  <rect x="20" y="20" width="80" height="72" rx="10" fill="url(#cb-oak)" stroke="#9a561e" stroke-width="1"/>
  <!-- Butcher-block wood grain planks -->
  <path d="M24 38H96" stroke="#b46b2c" stroke-opacity="0.35" stroke-width="1"/>
  <path d="M24 56H96" stroke="#854d0e" stroke-opacity="0.25" stroke-width="1"/>
  <path d="M24 72H96" stroke="#b46b2c" stroke-opacity="0.35" stroke-width="1"/>
  <!-- Warm wood specular grain -->
  <path d="M32 30C44 29 54 31 66 30" stroke="#fde68a" stroke-opacity="0.45" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M40 64C55 63 68 65 82 64" stroke="#fde68a" stroke-opacity="0.35" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Perimeter juice groove -->
  <rect x="26" y="26" width="68" height="60" rx="6" stroke="#854d0e" stroke-opacity="0.5" stroke-width="2"/>
  <!-- Top pill hanging slot -->
  <rect x="52" y="29" width="16" height="5" rx="2.5" fill="#fbfaf6" stroke="#854d0e" stroke-width="1"/>
