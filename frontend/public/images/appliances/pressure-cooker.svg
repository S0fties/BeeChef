<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <radialGradient id="pc-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pc-steel" x1="28" y1="45" x2="92" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9ca3af"/>
      <stop offset="28%" stop-color="#f9fafb"/>
      <stop offset="55%" stop-color="#d1d5db"/>
      <stop offset="85%" stop-color="#6b7280"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>
    <linearGradient id="pc-lid" x1="28" y1="30" x2="92" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f3f4f6"/>
      <stop offset="50%" stop-color="#9ca3af"/>
      <stop offset="100%" stop-color="#4b5563"/>
    </linearGradient>
  </defs>
  <ellipse cx="60" cy="100" rx="34" ry="6" fill="url(#pc-shadow)"/>
  <!-- Heavy black heat-resistant handles -->
  <path d="M29 52H15C12 52 10 54 10 57C10 60 12 62 15 62H29V52Z" fill="#1f2937"/>
  <path d="M91 52H105C108 52 110 54 110 57C110 60 108 62 105 62H91V52Z" fill="#1f2937"/>
  <!-- Long locking lid handle extending right -->
  <path d="M88 41H109C111.5 41 113 42.5 113 44.5C113 46.5 111.5 48 109 48H88V41Z" fill="#111827"/>
  <!-- Stainless pot body -->
  <path d="M29 50H91V88C91 93.5 85 97 60 97C35 97 29 93.5 29 88V50Z" fill="url(#pc-steel)" stroke="#6b7280" stroke-width="1"/>
  <!-- Brushed steel specular band -->
  <path d="M36 53V90" stroke="#ffffff" stroke-opacity="0.6" stroke-width="4" stroke-linecap="round"/>
  <!-- Heavy sealing gasket rim -->
  <ellipse cx="60" cy="50" rx="32" ry="6" fill="#374151"/>
  <!-- Domed stainless pressure lid -->
  <path d="M28 49C28 38 40 33 60 33C80 33 92 38 92 49C92 52 78 54 60 54C42 54 28 52 28 49Z" fill="url(#pc-lid)" stroke="#6b7280" stroke-width="0.9"/>
  <!-- Lid clamping bar -->
  <rect x="44" y="31" width="32" height="5" rx="2.5" fill="#1f2937"/>
  <!-- Central red pressure regulator valve -->
  <rect x="56" y="23" width="8" height="8" rx="2" fill="#dc2626"/>
  <rect x="54.5" y="21" width="11" height="3" rx="1.5" fill="#b91c1c"/>
  <!-- Secondary safety valve -->
  <rect x="70" y="27" width="4" height="5" rx="1.5" fill="#f59e0b"/>
  <!-- Steam wisps -->
  <path d="M58 17C56 14 60 11 58 8" stroke="#9ca3af" stroke-opacity="0.65" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M63 18C65 15 61 12 63 9" stroke="#9ca3af" stroke-opacity="0.45" stroke-width="1.5" stroke-linecap="round"/>
</svg>
