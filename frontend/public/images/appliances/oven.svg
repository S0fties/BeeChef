<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <radialGradient id="ov-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ov-steel" x1="16" y1="16" x2="104" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e5e7eb"/>
      <stop offset="40%" stop-color="#d1d5db"/>
      <stop offset="100%" stop-color="#6b7280"/>
    </linearGradient>
    <radialGradient id="ov-interior" cx="50%" cy="52%" r="55%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.72"/>
      <stop offset="60%" stop-color="#c2410c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </radialGradient>
  </defs>
  <ellipse cx="60" cy="107" rx="44" ry="6" fill="url(#ov-shadow)"/>
  <!-- Outer stainless frame -->
  <rect x="16" y="16" width="88" height="88" rx="5" fill="url(#ov-steel)" stroke="#6b7280" stroke-width="1.2"/>
  <!-- Top control bezel -->
  <rect x="19" y="19" width="82" height="16" rx="2.5" fill="#1f2937"/>
  <!-- 3 rotary knobs -->
  <circle cx="32" cy="27" r="4.2" fill="url(#ov-steel)" stroke="#111827" stroke-width="0.8"/>
  <path d="M32 23.5V26" stroke="#111827" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="46" cy="27" r="4.2" fill="url(#ov-steel)" stroke="#111827" stroke-width="0.8"/>
  <path d="M46 23.5L48 25.5" stroke="#111827" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Digital display -->
  <rect x="55" y="23" width="22" height="8" rx="1.5" fill="#090d14" stroke="#374151" stroke-width="0.6"/>
  <text x="66" y="29" text-anchor="middle" fill="#fb923c" font-family="monospace" font-size="5.5" font-weight="bold">180°C</text>
  <circle cx="88" cy="27" r="4.2" fill="url(#ov-steel)" stroke="#111827" stroke-width="0.8"/>
  <path d="M88 23.5L86 25.5" stroke="#111827" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Oven door frame -->
  <rect x="19" y="38" width="82" height="63" rx="3" fill="#111827"/>
  <!-- Handle bar -->
  <rect x="24" y="42" width="72" height="4.5" rx="2.2" fill="url(#ov-steel)" stroke="#4b5563" stroke-width="0.6"/>
  <!-- Illuminated glass window -->
  <rect x="26" y="51" width="68" height="43" rx="3" fill="url(#ov-interior)" stroke="#374151" stroke-width="1"/>
  <!-- Top heating element glow -->
  <path d="M34 55H86" stroke="#fed7aa" stroke-opacity="0.7" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Interior wire racks & baking tray -->
  <path d="M28 70H92" stroke="#9ca3af" stroke-opacity="0.65" stroke-width="1.5"/>
  <path d="M28 82H92" stroke="#9ca3af" stroke-opacity="0.55" stroke-width="1.5"/>
  <rect x="42" y="65" width="36" height="4.5" rx="1" fill="#374151"/>
  <!-- Glass specular shine -->
  <path d="M28 53H44L28 74Z" fill="#ffffff" fill-opacity="0.1"/>
</svg>
