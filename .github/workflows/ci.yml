name: CI Pipeline

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest

    # Throwaway PostgreSQL instance that lives only for this job.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: beechef
          POSTGRES_PASSWORD: beechef
          # Disposable database used by migrations and pytest.
          POSTGRES_DB: beechef_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beechef -d beechef_db_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Both settings point to this disposable CI test database.
      DATABASE_URL: postgresql+psycopg://beechef:beechef@localhost:5432/beechef_db_test
      TEST_DATABASE_URL: postgresql+psycopg://beechef:beechef@localhost:5432/beechef_db_test

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run database migrations (Alembic)
        run: alembic upgrade head

      - name: Check for ungenerated migrations
        run: alembic check

      - name: Run pytest
        run: pytest

  frontend:
    name: Frontend Checks (lint & build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build frontend
        run: npm run build
